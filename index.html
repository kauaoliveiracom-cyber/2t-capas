<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#08080d"><title>2T CAPAS</title><style>
:root{--bg:#08080d;--surface:#15151f;--red:#ff244d;--purple:#a855f7;--text:#f7f4fb;--muted:#aaa5b5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#211020,var(--bg) 55%);color:var(--text);font:15px system-ui,-apple-system,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}main{max-width:620px;margin:auto;padding:18px 0 28px}h1{font-size:34px;letter-spacing:1px;color:var(--red);margin:4px 0}h2{font-size:18px;margin:0 0 12px}p{color:var(--muted);line-height:1.5}.card{background:linear-gradient(145deg,#1b1a27,#11111a);border:1px solid #343044;border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 8px 28px #0005}.btn{width:100%;border:1px solid #ff4265;background:linear-gradient(110deg,#8d1233,#4b164f);color:white;padding:16px;border-radius:14px;font-weight:800;letter-spacing:.4px;margin:7px 0;font-size:15px}.btn.secondary{background:#211d2b;border-color:#554366}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#0d0d15;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;color:#fff;font-size:19px}.stat small{color:var(--muted)}.top{display:flex;align-items:center;gap:12px;margin:5px 0 14px}.back{background:#211d2b;color:white;border:1px solid #554366;border-radius:10px;padding:10px 13px}.arena{height:min(56vh,480px);min-height:300px;background:#11111b;border:1px solid #393247;border-radius:17px;position:relative;overflow:hidden;touch-action:none;margin:10px 0}.arena.green{background:#00a94f}.arena.wait{background:#84152d}.target{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#a855f7 0 25%,#08080d 27% 57%,#ff244d 60%);transform:translate(-50%,-50%);pointer-events:none}.cross{position:absolute;width:28px;height:28px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:var(--cross,#00ff9d);left:50%;top:50%;transform:translate(-50%,-50%)}.cross:before{width:2px;height:100%}.cross:after{height:2px;width:100%}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:22px;background:#08080dbb}.overlay .card{max-width:400px;width:100%}.field{margin:15px 0}.field label{display:flex;justify-content:space-between;gap:10px;margin-bottom:7px}.field input[type=range]{width:100%;accent-color:var(--red)}.switch{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.switch input{width:22px;height:22px;accent-color:var(--red)}.colors{display:flex;gap:12px;margin-top:10px}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent}.swatch.sel{border-color:white}canvas{width:100%;height:110px;background:#08080d;border-radius:12px}.hidden{display:none}
</style></head><body><main id="app"></main><script>
const $=s=>document.querySelector(s), defaults={assist:true,strength:.5,sensitivity:1,size:24,color:'#00ff9d',hud:.9,score:true,timer:true,accuracy:true,vibration:true};let cfg={...defaults,...JSON.parse(localStorage.getItem('2t-settings')||'{}')},rec={reaction:0,accuracy:0,score:0,...JSON.parse(localStorage.getItem('2t-records')||'{}')};const save=()=>localStorage.setItem('2t-settings',JSON.stringify(cfg)),saveRec=()=>localStorage.setItem('2t-records',JSON.stringify(rec));let page='home',game=null,timer=null,raf=null;
function shell(title,body){$('#app').innerHTML=`<div class="top"><button class="back" onclick="home()">← VOLTAR</button><div><b>${title}</b></div></div>${body}`}
function home(){stop();page='home';$('#app').innerHTML=`<h1>2T CAPAS</h1><p>Treino de mira, reflexos e precisão</p><section class="card"><h2>🏆 RECORDES</h2><div class="stats"><div class="stat"><b>${rec.reaction||'—'}</b><small>Reação ms</small></div><div class="stat"><b>${rec.accuracy||'—'}${rec.accuracy?'%':''}</b><small>Precisão</small></div><div class="stat"><b>${rec.score||'—'}</b><small>Pontuação</small></div></div></section><button class="btn" onclick="aimPage()">🎯 TREINO DE MIRA</button><button class="btn" onclick="reflexPage()">⚡ TREINO DE REFLEXOS</button><button class="btn" onclick="precisionPage()">◎ TREINO DE PRECISÃO</button><button class="btn secondary" onclick="settingsPage()">⚙️ CONFIGURAÇÕES</button><p class="muted">Treinos independentes de qualquer jogo. Seus ajustes e recordes ficam salvos neste aparelho.</p>`}
function stop(){clearInterval(timer);cancelAnimationFrame(raf);timer=null;raf=null;game=null}
function vibrate(){if(cfg.vibration&&navigator.vibrate)navigator.vibrate(20)}
function aimPage(){stop();page='aim';game={phase:'ready',score:0,hits:0,shots:0,left:30,x:0,y:0,tx:0,ty:0};shell('TREINO DE MIRA',`<div class="stats"><div class="stat"><b id="sc">0</b><small>Pontos</small></div><div class="stat"><b id="tm">30s</b><small>Tempo</small></div><div class="stat"><b id="ac">0%</b><small>Precisão</small></div></div><div class="arena" id="arena"></div><button class="btn" onclick="fire()">🔥 FOGO</button><div id="msg"></div>`);drawAimOverlay('PRONTO?','Arraste o dedo para mirar e toque em FOGO. Você tem 30 segundos.','COMEÇAR',startAim);let a=$('#arena');a.addEventListener('pointerdown',e=>{if(game.phase!=='run')return;a.setPointerCapture(e.pointerId);moveAim(e)});a.addEventListener('pointermove',e=>{if(game.phase==='run'&&e.buttons)moveAim(e)})}
function drawAimOverlay(t,d,b,fn){$('#msg').innerHTML=`<div class="overlay"><div class="card"><h2 style="color:var(--red)">${t}</h2><p>${d}</p><button class="btn" onclick="${fn.name}()">${b}</button></div></div>`}
function startAim(){game.phase='run';game.score=game.hits=game.shots=0;game.left=30;let a=$('#arena');game.x=a.clientWidth/2;game.y=a.clientHeight/2;spawnAim();$('#msg').innerHTML='';renderAim();timer=setInterval(()=>{if(game.phase!=='run')return;game.left--;$('#tm').textContent=game.left+'s';if(game.left<=0)endAim()},1000);let last=performance.now();function loop(now){if(!game||game.phase!=='run')return;let dt=Math.min((now-last)/1000,.04);last=now;if(cfg.assist){let dx=game.tx-game.x,dy=game.ty-game.y,d=Math.hypot(dx,dy),step=Math.min(cfg.strength*600*dt,d);if(d>0&&d<112){game.x+=dx/d*step;game.y+=dy/d*step}}renderAim();raf=requestAnimationFrame(loop)}raf=requestAnimationFrame(loop)}
function spawnAim(){let a=$('#arena');game.tx=28+Math.random()*Math.max(1,a.clientWidth-56);game.ty=28+Math.random()*Math.max(1,a.clientHeight-56)}function moveAim(e){let r=$('#arena').getBoundingClientRect();game.x=Math.max(0,Math.min(r.width,game.x+(e.clientX-r.left-game.x)*cfg.sensitivity));game.y=Math.max(0,Math.min(r.height,game.y+(e.clientY-r.top-game.y)*cfg.sensitivity));renderAim()}function renderAim(){let a=$('#arena');a.innerHTML=`<div class="target" style="left:${game.tx}px;top:${game.ty}px"></div><div class="cross" style="left:${game.x}px;top:${game.y}px;width:${cfg.size}px;height:${cfg.size}px;--cross:${cfg.color}"></div>`;$('#sc').textContent=game.score;$('#ac').textContent=(game.shots?Math.round(game.hits*100/game.shots):0)+'%'}function fire(){if(!game||game.phase!=='run')return;game.shots++;if(Math.hypot(game.x-game.tx,game.y-game.ty)<=28){game.hits++;game.score+=100;vibrate();spawnAim()}renderAim()}function endAim(){clearInterval(timer);cancelAnimationFrame(raf);game.phase='done';rec.score=Math.max(rec.score,game.score);rec.accuracy=Math.max(rec.accuracy,game.shots?Math.round(game.hits*100/game.shots):0);saveRec();$('#arena').innerHTML='';drawAimOverlay('FIM DA RODADA',`Pontos: ${game.score} • Acertos: ${game.hits}/${game.shots} • Precisão: ${game.shots?Math.round(game.hits*100/game.shots):0}%`,'JOGAR DE NOVO',startAim)}
function reflexPage(){stop();page='reflex';game={state:'idle',round:0,times:[],goAt:0};shell('TREINO DE REFLEXOS',`<div class="arena" id="react" style="display:grid;place-items:center;text-align:center;padding:25px;font-size:23px;font-weight:900" onclick="tapReflex()">Toque para começar. Quando ficar VERDE, toque o mais rápido possível.</div>`)}function tapReflex(){if(!game)return;let a=$('#react');if(game.state==='idle'||game.state==='done'){game.times=[];game.round=0;waitReflex()}else if(game.state==='waiting'){clearTimeout(timer);game.state='early';a.className='arena';a.textContent='CEDO DEMAIS! Toque para tentar novamente.'}else if(game.state==='go'){let ms=Math.round(performance.now()-game.goAt);game.times.push(ms);game.round++;vibrate();if(game.round===5){game.state='done';let best=Math.min(...game.times);rec.reaction=rec.reaction?Math.min(rec.reaction,best):best;saveRec();a.className='arena';a.textContent=`FINALIZADO! Média: ${Math.round(game.times.reduce((x,y)=>x+y,0)/5)} ms • Melhor: ${best} ms. Toque para recomeçar.`}else{game.state='result';a.className='arena';a.textContent=`${ms} ms • Rodada ${game.round}/5. Toque para continuar.`}}else waitReflex()}function waitReflex(){game.state='waiting';let a=$('#react');a.className='arena wait';a.textContent='ESPERE…';timer=setTimeout(()=>{if(!game||game.state!=='waiting')return;game.state='go';game.goAt=performance.now();a.className='arena green';a.textContent='TOQUE AGORA!'},1500+Math.random()*2500)}
function precisionPage(){stop();page='precision';game={state:'ready',idx:0,hits:0,points:0,target:null,start:0};shell('TREINO DE PRECISÃO',`<div class="stats"><div class="stat"><b id="pp">0</b><small>Pontos</small></div><div class="stat"><b id="pr">0/20</b><small>Alvos</small></div><div class="stat"><b id="pa">0%</b><small>Precisão</small></div></div><div class="arena" id="prec"></div><div id="pmsg"></div>`);$('#prec').addEventListener('pointerdown',hitPrecision);precisionOverlay('PRONTO?','Acerte 20 alvos antes que encolham. Quanto mais perto do centro, mais pontos.','COMEÇAR',startPrecision)}function precisionOverlay(t,d,b,fn){$('#pmsg').innerHTML=`<div class="overlay"><div class="card"><h2 style="color:var(--red)">${t}</h2><p>${d}</p><button class="btn" onclick="${fn.name}()">${b}</button></div></div>`}function startPrecision(){game.state='run';game.idx=game.hits=game.points=0;$('#pmsg').innerHTML='';nextTarget()}function nextTarget(){if(game.idx>=20){game.state='done';rec.accuracy=Math.max(rec.accuracy,Math.round(game.hits/20*100));rec.score=Math.max(rec.score,game.points);saveRec();precisionOverlay('RESULTADO',`Acertos: ${game.hits}/20 • Precisão: ${Math.round(game.hits/20*100)}% • Pontos: ${game.points}`,'JOGAR DE NOVO',startPrecision);return}let a=$('#prec');game.target={x:40+Math.random()*Math.max(1,a.clientWidth-80),y:40+Math.random()*Math.max(1,a.clientHeight-80)};game.start=performance.now();renderPrecision();cancelAnimationFrame(raf);function tick(now){if(!game||game.state!=='run')return;let p=Math.min(1,(now-game.start)/1600);renderPrecision(p);if(p>=1){game.idx++;nextTarget()}else raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)}function renderPrecision(p=0){let a=$('#prec'),r=40-28*p;a.innerHTML=`<div class="target" style="width:${r*2}px;height:${r*2}px;left:${game.target.x}px;top:${game.target.y}px"></div>`;$('#pp').textContent=game.points;$('#pr').textContent=game.idx+'/20';$('#pa').textContent=Math.round(game.hits/Math.max(1,game.idx)*100)+'%'}function hitPrecision(e){if(!game||game.state!=='run')return;let r=$('#prec').getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,d=Math.hypot(x-game.target.x,y-game.target.y),progress=Math.min(1,(performance.now()-game.start)/1600),rad=40-28*progress;if(d<=rad){game.hits++;game.points+=Math.floor(10+90*(1-d/rad));vibrate()}game.idx++;cancelAnimationFrame(raf);nextTarget()}
function settingsPage(){stop();page='settings';shell('CONFIGURAÇÕES',`<section class="card"><h2>MIRA</h2>${toggle('Assistência de mira (no treino)','assist')}${range('Força da assistência','strength',0,1,.01,'%')}${range('Sensibilidade','sensitivity',.3,3,.1,'x')}${range('Tamanho da mira','size',10,48,1,' dp')}<p>Cor da mira</p><div class="colors">${['#00ff9d','#ff244d','#a855f7','#ffffff','#00c8ff'].map(c=>`<button class="swatch ${cfg.color===c?'sel':''}" style="background:${c}" onclick="cfg.color='${c}';save();settingsPage()"></button>`).join('')}</div><p>Prévia</p><div style="height:90px;background:#08080d;border-radius:12px;display:grid;place-items:center"><div class="cross" style="position:relative;left:auto;top:auto;width:${cfg.size}px;height:${cfg.size}px;--cross:${cfg.color}"></div></div></section><section class="card"><h2>HUD</h2>${toggle('Mostrar pontuação','score')}${toggle('Mostrar tempo','timer')}${toggle('Mostrar precisão','accuracy')}${range('Opacidade do HUD','hud',.2,1,.05,'%')}</section><section class="card"><h2>FEEDBACK</h2>${toggle('Vibração ao acertar','vibration')}</section><button class="btn secondary" onclick="cfg={...defaults};save();settingsPage()">RESTAURAR PADRÃO</button>`)}function toggle(label,key){return `<div class="switch"><label>${label}</label><input type="checkbox" ${cfg[key]?'checked':''} onchange="cfg.${key}=this.checked;save()"></div>`}function range(label,key,min,max,step,unit){return `<div class="field"><label><span>${label}</span><b id="v-${key}">${key==='strength'||key==='hud'?Math.round(cfg[key]*100):cfg[key]}${unit}</b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${cfg[key]}" oninput="cfg.${key}=Number(this.value);$('#v-${key}').textContent=${key==='strength'||key==='hud'?'Math.round(cfg[key]*100)':'cfg[key]'}+'${unit}';save()"></div>`}
home();
</script></main></body></html>
